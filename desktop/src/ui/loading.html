<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file:">
<title></title>
<style>
  /* pi-web's own light and dark tokens (app/globals.css), so the hand-over to the real page is not a flash. */
  :root {
    --bg: #ffffff;
    --panel: #f5f5f5;
    --hover: #eeeeee;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --muted: #5e6673;
    --accent: #245bce;
    --accent-contrast: #ffffff;
  }
  :root.dark {
    --bg: #1a1a1a;
    --panel: #242424;
    --hover: #2e2e2e;
    --border: #454545;
    --text: #e8e8e8;
    --muted: #a4a4a4;
    --accent: #a4c2f4;
    --accent-contrast: #182234;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  header { position: fixed; inset: 0 0 auto; height: 36px; display: flex; justify-content: flex-end; align-items: stretch; app-region: drag; background: var(--panel); border-bottom: 1px solid var(--border); }
  header button { app-region: no-drag; display: grid; place-items: center; width: 42px; padding: 0; border: 0; border-radius: 0; color: var(--muted); }
  header button:first-child { border-left: 1px solid var(--border); }
  header button:hover { background: #e8e9ea; }
  .dark header button:hover { background: var(--hover); }
  header svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
  header button[data-cmd="close"]:hover { background: #c42b1c; color: white; }
  body {
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    user-select: none;
  }
  main {
    display: grid;
    justify-items: center;
    gap: 18px;
    width: min(520px, calc(100vw - 48px));
  }
  img { width: 44px; height: 44px; border-radius: 11px; -webkit-user-drag: none; }
  .bar { width: 112px; height: 2px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .bar::after {
    content: "";
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 2px;
    background: var(--muted);
    animation: slide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) {
    .bar::after { width: 100%; opacity: 0.5; animation: none; }
  }
  .status { min-height: 20px; color: var(--muted); }
  .failed { display: none; justify-items: center; gap: 8px; width: 100%; text-align: center; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  p { margin: 0; color: var(--muted); }
  pre {
    width: 100%;
    max-height: 190px;
    margin: 8px 0 0;
    padding: 10px 12px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    font: 11.5px/1.5 "Cascadia Mono", Consolas, monospace;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    user-select: text;
  }
  pre:empty { display: none; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font: inherit;
  }
  button:hover { background: var(--hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-contrast); }
  button.primary:hover { background: var(--accent); filter: brightness(1.08); }
  body[data-phase="failed"] .bar,
  body[data-phase="failed"] .status { display: none; }
  body[data-phase="failed"] .failed { display: grid; }
</style>
</head>
<body data-phase="starting">
<header>
  <button data-cmd="minimize"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5.5 14.5h13"/></svg></button>
  <button data-cmd="toggle-maximize"><svg aria-hidden="true" viewBox="0 0 24 24"><path id="max-icon" d="M5 5h14v14H5z"/></svg></button>
  <button data-cmd="close"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11m0-11-11 11"/></svg></button>
</header>
<main>
  <img id="logo" alt="" hidden>
  <div class="bar"></div>
  <div class="status" id="status"></div>
  <section class="failed">
    <h1 id="failed-title"></h1>
    <p id="failed-hint"></p>
    <pre id="log"></pre>
    <div class="actions">
      <button class="primary" id="retry" data-action="retry"></button>
      <button id="logs" data-action="logs"></button>
      <button id="quit" data-action="quit"></button>
    </div>
  </section>
</main>
<script>
  const byId = (id) => document.getElementById(id);
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const controls = window.piDesktopHost?.windowControls;
  const zh = navigator.language.startsWith("zh");
  const commands = [...document.querySelectorAll("button[data-cmd]")];
  const renderControls = (state) => {
    const max = !!state?.maximized;
    byId("max-icon").setAttribute("d", max ? "M8.5 7.5V6a2 2 0 0 1 2-2H17a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-1.5M6.8 8.5h6.4a2.3 2.3 0 0 1 2.3 2.3v6.4a2.3 2.3 0 0 1-2.3 2.3H6.8a2.3 2.3 0 0 1-2.3-2.3v-6.4a2.3 2.3 0 0 1 2.3-2.3z" : "M7.5 5.5h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z");
    const labels = zh ? ["最小化", max ? "还原" : "最大化", "关闭"] : ["Minimize", max ? "Restore" : "Maximize", "Close"];
    commands.forEach((button, i) => { button.title = labels[i]; button.setAttribute("aria-label", labels[i]); });
  };
  renderControls();
  if (controls) {
    commands.forEach(button => button.addEventListener("click", () => controls.run(button.dataset.cmd)));
    controls.onState(renderControls);
    controls.getState().then(renderControls);
  }

  for (const button of document.querySelectorAll("button[data-action]")) {
    button.addEventListener("click", () => window.piDesktopHost.action(button.dataset.action));
  }

  // The main process fills this page in: once through the query string, then
  // again whenever the server's state changes.
  window.piDesktop = {
    show(state) {
      const root = document.documentElement;
      root.classList.toggle("dark", typeof state.dark === "boolean" ? state.dark : systemDark);
      if (state.bg) root.style.setProperty("--bg", state.bg);
      document.title = state.title ?? "";
      document.body.dataset.phase = state.phase ?? "starting";
      byId("status").textContent = state.status ?? "";
      byId("failed-title").textContent = state.failedTitle ?? "";
      byId("failed-hint").textContent = state.failedHint ?? "";
      byId("log").textContent = state.log ?? "";
      byId("retry").textContent = state.retry ?? "";
      byId("logs").textContent = state.openLogs ?? "";
      byId("quit").textContent = state.quit ?? "";
      if (state.icon) {
        byId("logo").src = state.icon;
        byId("logo").hidden = false;
      }
      const log = byId("log");
      log.scrollTop = log.scrollHeight;
    },
  };

  try {
    window.piDesktop.show(JSON.parse(new URLSearchParams(location.search).get("state") ?? "{}"));
  } catch {
    window.piDesktop.show({});
  }
</script>
</body>
</html>
